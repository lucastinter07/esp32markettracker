; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; `pio run` builds the board firmware only. The native env is for tests.
default_envs = esp32-s3-devkitc-1-n8r8

[env:esp32-s3-devkitc-1-n8r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 8MB
board_build.psram_type = opi
upload_protocol = esptool
monitor_speed = 115200
; -I src: lets files include each other as "hal/display.h", "ui/theme.h", etc.
; ARDUINO_USB_CDC_ON_BOOT=1: this board has a single USB-C port wired to the chip's
; built-in USB, so Serial must go there (by default it goes to UART0 pins 43/44).
build_flags =
    -I src
    -D ARDUINO_USB_CDC_ON_BOOT=1

; Runs the hardware-free tests in test/ on this PC: pio test -e native
[env:native]
platform = native
test_framework = unity
