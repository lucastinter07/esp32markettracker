; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; `pio run` builds the board firmware only. The native env is for tests.
default_envs = esp32-s3-devkitc-1-n8r8

; Settings shared by every environment below.
[env]
lib_deps =
    bblanchon/ArduinoJson@^7.2.0

[env:esp32-s3-devkitc-1-n8r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 8MB
board_build.psram_type = opi
; Both N8R8 and N16R8 have 8 MB of octal PSRAM: qio_opi + BOARD_HAS_PSRAM turn it on
; (Phase 12). Big allocations (> 4 KB) then go there, leaving internal RAM for TLS.
board_build.arduino.memory_type = qio_opi
upload_protocol = esptool
monitor_speed = 115200
; time: a PC timestamp on every line; log2file: also saves the log to
; platformio-device-monitor-*.log in this folder (for the soak; gitignored).
monitor_filters = time, log2file
; -I src: lets files include each other as "hal/display.h", "ui/theme.h", etc.
; ARDUINO_USB_CDC_ON_BOOT=1: this board has a single USB-C port wired to the chip's
; built-in USB, so Serial must go there (by default it goes to UART0 pins 43/44).
build_flags =
    -I src
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM
; Reads FINNHUB_API_KEY from .env and passes it to the compiler (see tools/load_env.py).
extra_scripts = pre:tools/load_env.py

; Runs the hardware-free tests in test/ on this PC: pio test -e native
[env:native]
platform = native
test_framework = unity
